items:
  - content: "_**Technical strategist**_ and principal-level engineering leader with 15+ years of experience architecting multi-surface software platforms across mobile, web, and desktop. Proven track record of setting long-term technical direction, driving platform strategy, and influencing product roadmaps and business outcomes across organizations. Over a decade of ownership of cross-product frameworks and SDKs adopted company-wide. Operate comfortably at both the architectural vision and hands-on execution - actively writing and reviewing code (~50%) while leading architectural strategy, platform evolution, and cross-functional alignment with product and business leadership. Speaker at multiple industry conferences, author of Hugo in Action, and inventor of Adobe Shape (US Patent US-9449248, IxDA Interaction Design Award 2014)."
