  - content: "**Platforms** that ship to millions. **Books** that teach developers to build blazing-fast websites. **Patents** that changed how people interact with creative tools.\n\nPrincipal Scientist at Adobe, leading cross-product platform strategy — staying hands-on with code while aligning engineering, product, and business around long-horizon technical bets. Author of **[Hugo in Action](https://www.manning.com/books/hugo-in-action)** (Manning). Inventor of Adobe Shape (US Patent US-9449248, IxDA Interaction Design Award 2014). Regular speaker on platform engineering and developer experience."
