title: Experience
subtitle: Principal Scientist at Adobe Inc.
icon: home/experience/adobe.svg
items:
  - icon:
      href: "home/experience/aep.png"
    title: Adobe Growth SDK
    content: "\n\nTechnical lead for the 'Adobe on Adobe' PLG/XLG initiative, making Adobe's flagship Digital Media products (Photoshop, Acrobat, and the broader Creative and Document Cloud suite) primary customers of Adobe Experience Platform (AEP), Adobe's unified data and marketing stack. Built the AEP SDK for desktop from scratch with cross-platform extensions across web, iOS, and Android, migrating 30+ products and 800M+ active users ahead of schedule. Enabled Monthly Active Use (MAU) measurement by shipping instrumentation into every Creative and Document Cloud product, and pioneered agentic and LLM-based integrations within the marketing stack. Member of the Creative Cloud Architectural Council and Adobe Principal Group, advising VP staff on strategy and long-term platform evolution.\n\n"
    links:
      - href: https://business.adobe.com/products/experience-platform/adobe-experience-platform.html
        title: Adobe Experience Platform
        icon: link
  - icon:
      href: "home/experience/ccx.png"
    title: CC Experience Platform
    content: "\n\nBuilt and shipped the Engagement SDK across all Adobe mobile apps, enabling A/B experimentation for Paywalls, In-App Messages, and Push Notifications, contributing to $200M ARR in 2023. Drove technical direction and roadmap for multiple teams within the Creative Cloud Engagement and Experience organization, focused on in-product personalization and growth. Served as architect across the full mobile engagement stack, from SDK design through product integration.\n\n"
    links:
      - href: https://www.adobe.com/products/photoshop/app.html
        title: Photoshop Mobile
        icon: link
  - icon:
      href: "home/experience/cc.png"
    title: CC Experience Desktop
    content: "\n\nLead developer of in-app systems for Photoshop, Illustrator, InDesign, Premiere, After Effects, and Dreamweaver, including the home screen and Cloud Documents entry point. Delivered the first client implementation for Adobe's Unified Extensibility Platform (UXP), the company's migration from Chromium to a React Native-like extensibility layer. Desktop representative in the architecture of Next Generation Licensing, Adobe's platform rewrite for the SaaS business model transition.\n\n"
    links:
      - href: https://www.adobe.com/creativecloud.html
        title: Creative Cloud
        icon: link
  - icon:
      href: "home/experience/cc-folder.svg"
    title: CC Libraries
    content: "\n\nMember of the team that built CC Libraries, Adobe’s cross-app platform for sharing colors, graphics, and text styles across every Creative Cloud application. Scaled it from a single product demo to an enterprise solution spanning imaging, publishing, video, and 3D. Drove adoption across the full Adobe product suite and extended the technology to Microsoft Office via a prototype that was eventually productized.\n\n"
    links:
      - href: http://www.adobe.com/creativecloud/libraries.html
        title: CC Libraries
        icon: link
      - youtube: 76A1i9o7g6U
        title: Demo
        icon: film
  - title: Adobe Shape
    icon:
      href: home/experience/shape.svg
    content: "\n\nPrimary inventor and sole developer of Adobe Shape CC, from concept to keynote launch at Adobe Max 2014. Won the IxDA Interaction Design Award and a US Patent (US-9449248); surpassed 500K App Store downloads within six months. Collaborated closely with Adobe Research to run advanced imaging algorithms via GPGPU (OpenGL) on iPhone 4 hardware.\n\n"
    links:
      - href: http://www.adobe.com/products/capture.html
        title: Capture
        icon: link
      - youtube: QIasMlptd7k
        title: Demo
        icon: film
  - title: Adobe Color
    icon:
      href: home/experience/color.svg
    content: "\n\nMember of the small team that resurrected Adobe Kuler, a widely-used web and mobile tool for creating and sharing color palettes, from maintenance mode to two consecutive Adobe Max keynotes (2011, 2013). Major contributor to the full web stack architecture and its deployment, as well as the native iOS app (now Adobe Capture). Migrated the entire product from ColdFusion and Flash to HTML5 and Node.js on AWS.\n\n"
    links:
      - href: https://color.adobe.com
        title: Adobe Color
        icon: link
      - youtube: nuXG-MOL6-0
        title: Demo
        icon: film
  - title: Adobe InDesign
    icon:
      href: home/experience/id.svg
    content: "\n\nManaged the Creative Suite SDK powering HTML-based third-party extensions within InDesign, Adobe's industry-standard page layout and print publishing application, including the Adobe Digital Publishing Suite. Led the architectural migration of a multi-gigabyte codebase from the legacy Carbon API to Cocoa on macOS. Supported the broader plugin ecosystem across InDesign, Illustrator, and the full Creative Suite.\n\n"
    links:
      - href: http://www.adobe.com/products/indesign.html
        title: Adobe InDesign
        icon: link
      - href: /home/cs.html
        title: CS SDK
        icon: archive
